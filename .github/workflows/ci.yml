name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vue: [locked, '3.3.4']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: matrix.vue != 'locked'
        run: npm install --no-save --package-lock=false "vue@$VUE_VERSION"
        env:
          VUE_VERSION: ${{ matrix.vue }}
      - run: npm test
